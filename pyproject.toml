# Tool configuration shared by the whole monorepo.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "DTZ", "SIM", "RUF"]
ignore = [
    "B008",  # Depends()/Query() in FastAPI signatures is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
# Legacy code from the degree project (TFG): the rules get switched on as each phase
# of the plan rewrites the module. New code (packages/) has no exceptions.
"apps/api/**" = ["F401", "F811", "F541", "B", "I", "UP", "DTZ", "SIM", "RUF", "E7"]
# Research: exploratory scripts that generate the models and the reference tables, not product code.
"research/**" = ["F401", "F811", "F841", "F541", "F601", "B", "I", "UP", "DTZ", "SIM", "RUF", "E7"]
