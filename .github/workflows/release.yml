name: Build Desktop & Mobile Apps (YGG)

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            output_path: build/windows/x64/runner/Release
            artifact_name: YGG-Windows
            extension: zip
          - os: ubuntu-latest
            platform: linux
            output_path: build/linux/x64/release/bundle
            artifact_name: YGG-Linux
            extension: tar.gz
          - os: ubuntu-latest
            platform: apk
            output_path: build/app/outputs/flutter-apk
            artifact_name: YGG-Android
            extension: apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Application
        run: flutter build ${{ matrix.platform }} --release

      - name: Prepare Windows Artifact
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "${{ github.workspace }}\artifact-windows" -Force
          Copy-Item -Path "${{ matrix.output_path }}\*" -Destination "${{ github.workspace }}\artifact-windows\" -Recurse

      - name: Compress Linux Build
        if: matrix.platform == 'linux'
        run: |
          tar -czvf ${{ github.workspace }}/${{ matrix.artifact_name }}.tar.gz -C ${{ matrix.output_path }} .

      - name: Prepare APK Artifact
        if: matrix.platform == 'apk'
        run: |
          cp ${{ matrix.output_path }}/app-release.apk ${{ github.workspace }}/${{ matrix.artifact_name }}.apk

      - name: Upload Windows Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/artifact-windows/

      - name: Upload Linux/APK Artifact
        if: matrix.platform != 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/${{ matrix.artifact_name }}.${{ matrix.extension }}