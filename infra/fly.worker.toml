# Fly.io: analysis worker (ARQ). Same Dockerfile as the API, no HTTP port.
#   flyctl deploy --config infra/fly.worker.toml --dockerfile infra/Dockerfile.api
# Secrets (flyctl secrets set -a ygg-worker ...): DATABASE_URL, REDIS_URL,
# SECRET_KEY, RIOT_API_KEY and optionally SENTRY_DSN. See docs/deploy.md.

app = "ygg-worker"
primary_region = "mad"

[env]
  ENVIRONMENT = "production"
  JOB_BACKEND = "arq"
  LOG_LEVEL = "INFO"

[processes]
  worker = "arq app.jobs.worker.WorkerSettings"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["worker"]
