# Entorno local completo:  make up   (o: docker compose -f infra/docker-compose.yml up -d --build)
name: ygg

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ygg
      POSTGRES_PASSWORD: ygg
      POSTGRES_DB: ygg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ygg -d ygg"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://ygg:ygg@postgres:5432/ygg
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-solo-para-desarrollo-local}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
